[package]
name = "sudo1"
version = "0.2.0"
edition = "2024"


[dependencies]
# bevy = "0.18.1"
rand = { version = "0.10.1", features = ["std"] }
# bevy-inspector-egui = "0.38.0"
bevy_feathers = "0.18.1"
bevy = { version = "0.18.1", features = ["experimental_bevy_feathers"] }


# bevy = "0.18.1"
# bevy = { version = "0.18.1", default-features = false, features = ["bevy_render", "bevy_ui", "ui", "bevy_winit", "bevy_render", "bevy_app", "bevy_asset", "bevy_core"] }
# bevy = { version = "0.18.1", default-features = true }
# rand = "0.10.1"


[features]
# Enable a small amount of optimization in debug mode
# For debug / step through code, consider:  opt-level = 0
[profile.dev]
opt-level = 1


# "bevy_picking" = ["bevy_ui"]  # Enable bevy_ui feature for bevy_picking

# [dependencies.bevy_picking]
# version = "0.18.1"
# default-features = false
# features = ["bevy_ui"]
# features = ["bevy_ui", "bevy_render"]  # Enable bevy_ui and bevy_render features for bevy_picking

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3
